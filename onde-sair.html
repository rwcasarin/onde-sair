ã"],extras:["Experiência única","Para ir com crianças"],tint:"tint-turist",bairro:"Jardim Paulistano",end:"R. Mooca, 35 · Jardim Paulistano",cep:"18040-700",geo:null,placeId:"",map:{x:50,y:66,label:"SB"},rating:0,reviews:0,seo:{title:"Sophie's BBQ · Churrasco americano em Sorocaba",desc:"Brisket, costela e pulled pork defumados na lenha, além de café da manhã americano no fim de semana. No Jardim Paulistano, em Sorocaba."}},{id:"parque-agua-vermelha",slug:"parque-da-agua-vermelha",status:"publicado",city:"sorocaba",name:"Parque da Água Vermelha",sub:"Parque natural com lagos",cuisine:"Natureza, trilha e educação ambiental",tagline:"Garça, cágado e trilha em volta do lago, de graça, no meio do Jardim Europa.",desc:"Um respiro verde no Jardim Europa, onde dá pra ver garça, cágado e pica-pau sem sair da cidade. A trilha contorna os lagos sem pressa, a criançada se diverte entre aquário, playground e jardim sensorial, e as mesas de piquenique esperam o lanche que você trouxer. E a entrada é de graça.",dica:"Vá de manhã, quando os bichos estão mais ativos, e leve lanche pras mesas de piquenique. Fecha às segundas e a entrada vai só até 16h30.",by:"Curadoria · Onde Sair",note:"as garças chegam antes de você",reasons:[["heart","Garça, cágado e pica-pau de pertinho"],["leaf","Trilha tranquila em volta dos lagos"],["coins","Entrada gratuita"],["smile","Aquário, playground e jardim sensorial"]],type:"Parques",open:"Ter–Dom · 8h–17h (entrada até 16h30)",phone:"(15) 3221-6643",site:"meioambiente.sorocaba.sp.gov.br/educacaoambiental/parque-natural-agua-vermelha/",insta:"",priceLevel:0,momento:["Experiência cultural"],ambiente:["Ambiente externo"],reserva:!1,affs:["crianca","relax","eco"],tags:["Natureza","Lagos","Piquenique"],extras:["Para ir com crianças","Sem pressa"],tint:"tint-crianca",bairro:"Jardim Europa",end:"R. România, 150 · Jardim Europa",cep:"18045-040",geo:{lat:-23.521002,lng:-47.48693},placeId:"",map:{x:30,y:58,label:"AV"},rating:0,reviews:0,seo:{title:"Parque da Á
