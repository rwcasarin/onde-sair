name: APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Gera o APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: onde-sair-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publica o APK na branch apk
        working-directory: web/android/app/build/outputs/apk/debug
        run: |
          mkdir /tmp/apk && cp app-debug.apk /tmp/apk/onde-sair.apk && cd /tmp/apk
          git init -q -b apk && git add onde-sair.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
